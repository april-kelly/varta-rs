[package]
name = "varta-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
chrono = "0.4"
clap = { version = "4.5.37", features = ["derive"] }
crossterm = "0.28"
ratatui = { version = "0.29", features = ["crossterm"] }
tokio = { version = "1.45.0", features = ["net", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
zencan-client = { git = "https://github.com/mcbridejc/zencan.git", features = ["socketcan"] }

serde_json = "1.0"
strum = "0.27"
varta-easyblade = { path = "../varta-easyblade" }
